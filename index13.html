        let player;

        // Load YouTube IFrame API
        const tag = document.createElement('script');

        // Button click
        document.getElementById("loadButton").addEventListener("click", function () {

            // Read textbox value
            const vidId = document.getElementById("videoInput").value.trim();

            if (!vidId) {
                alert("Please enter a YouTube Video ID");
                return;
            }

            // Create YouTube player
            player = new YT.Player('player', {
                videoId: vidId,
                playerVars: {
                    autoplay: 1,
                    controls: 1
                },
                events: {
                    onReady: () => {
                        console.log("Player ready");
                    }
                }
            });
        });

        // Pause when tab becomes hidden
        document.addEventListener("visibilitychange", () => {
            if (!player) return;

            if (document.hidden) {
                pauseVideo();
                console.log("Video paused");
            } else {

                   console.log("Video paused");
                playVideo();
            }
        });

        function playVideo() {
            if (player) {
                player.playVideo();
            }
        }

        function pauseVideo() {
            if (player) {
                player.pauseVideo();
            }
        }

        function stopVideo() {
            if (player) {
                player.stopVideo();
            }
        }
